name: Pack decorator runtime

# The runtime references nothing outside its own project, so it builds from a plain checkout: no sibling
# framework layout (bamtk#77) is needed here. Pushes to nuget.org only when the NUGET_API_KEY secret exists.
on:
  push:
    tags: ['runtime-v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build the runtime (netstandard2.0 + net10.0) and the net472 compile proof
        run: |
          dotnet build bam.generators.decorators.runtime/bam.generators.decorators.runtime.csproj -c Release
          dotnet build bam.generators.decorators.runtime.compat472/bam.generators.decorators.runtime.compat472.csproj -c Release

      - name: Pack
        run: dotnet pack bam.generators.decorators.runtime/bam.generators.decorators.runtime.csproj -c Release -p:PackageOutputPath="$RUNNER_TEMP/pack/"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bam.generators.decorators.runtime
          path: ${{ runner.temp }}/pack/*.nupkg

      - name: Push to nuget.org
        if: ${{ startsWith(github.ref, 'refs/tags/runtime-v') && env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP"/pack/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
